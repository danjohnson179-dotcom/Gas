name: Update wholesale prices

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: wholesale-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh wholesale prices
        run: node scripts/update-prices.mjs

      - name: Publish prices.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          CONTENT="$(base64 -w 0 data/prices.json)"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"

            SHA="$(gh api "repos/$GH_REPO/contents/data/prices.json?ref=main" --jq '.sha')"

            if gh api \
              --method PUT \
              "repos/$GH_REPO/contents/data/prices.json" \
              -f message="data: refresh wholesale prices" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch="main"
            then
              echo "prices.json published successfully"
              exit 0
            fi

            echo "Publish conflicted. Waiting and retrying..."
            sleep 3
          done

          echo "Failed to publish prices.json after 5 attempts"
          exit 1
