name: Update wholesale prices

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: wholesale-price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh wholesale prices
        run: node scripts/update-prices.mjs

      - name: Commit refreshed prices
        shell: bash
        run: |
          set -e

          git config user.name "gb-energy-live-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the newly generated price file safe while we sync main.
          cp data/prices.json /tmp/prices.json

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            # Move the runner onto the latest version of main.
            git fetch origin main
            git reset --hard origin/main

            # Restore the newly generated prices.
            cp /tmp/prices.json data/prices.json
            git add data/prices.json

            if git diff --cached --quiet; then
              echo "No price change to commit"
              exit 0
            fi

            git commit -m "data: refresh wholesale prices"

            if git push origin HEAD:main; then
              echo "Price update pushed successfully"
              exit 0
            fi

            echo "Main changed again while pushing. Retrying..."
            sleep 3
          done

          echo "Could not push after 3 attempts"
          exit 1
